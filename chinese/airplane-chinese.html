<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>飞机上的静心</title><meta content="利用高空与开阔感，分三步体验身体边界不断扩大，最后与天空的空间感融合。" name="description"/><link href="../css/theme.css" rel="stylesheet"/><link href="manifest.json" rel="manifest"/><meta content="#8e24aa" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="yes" name="mobile-web-app-capable"/></head><body id="top"><header class="hero"><h1>飞机上的静心</h1><p>向无限扩展</p></header><div class="detail-wrap"><a class="back" href="index.html#part3">← 返回静心的方法</a><article class="detail-card"><div class="crumb">第三部分 · 第15章《找到内在的空间》</div><h1>飞机上的静心</h1><p class="lead">利用高空与开阔感，分三步体验身体边界不断扩大，最后与天空的空间感融合。</p><div class="meta"><span class="pill">飞行中</span><span class="pill">核心：观照</span></div><h2>练习方式</h2><ol class="practice-steps" id="steps"><li>先感觉自己充满座位与机舱。</li><li>再感觉机舱仿佛在你之内。</li><li>最后让自己扩展到天空、云与星辰的空间。</li></ol><div class="witness-box"><strong>不要丢掉观照</strong><br/>方法只是入口。无论是呼吸、舞蹈、声音、黑暗、静坐还是关系，最重要的是逐渐看见“正在发生什么”，而不是只追求某种体验。</div><div class="nextrow"><a href="index.html#part3">返回方法目录</a><a href="guide-right-click-chinese.html">怎样选择一个适合自己的方法 →</a></div></article></div><div class="footer">静心不是逃离生活，而是在生活中不失去中心。</div><nav aria-label="手机快捷导航" class="mobile-dock"><a class="accent" href="index.html#part3"><span class="icon">☰</span><span>方法</span></a><a href="#steps"><span class="icon">①</span><span>步骤</span></a><a href="#top"><span class="icon">↑</span><span>顶部</span></a><a href="index.html"><span class="icon">⌂</span><span>首页</span></a></nav><script>
(function(){
  try{localStorage.setItem('meditation-last-page',location.pathname.split('/').pop()||'index.html')}catch(e){}
  const audios=[...document.querySelectorAll('audio')];
  function playAudio(i=0){
    const a=audios[i]||audios[0]; if(!a) return;
    a.scrollIntoView({behavior:'smooth',block:'center'});
    a.play().catch(()=>{});
  }
  document.querySelectorAll('.play-btn').forEach(b=>b.addEventListener('click',()=>playAudio(Number(b.dataset.audioIndex||0))));
  document.querySelectorAll('.dock-play').forEach(b=>b.addEventListener('click',()=>playAudio(0)));
  document.querySelectorAll('.primary-action[href="#practice-audio"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();playAudio(0)}));
})();
</script><script defer="True" src="../js/app.js"></script></body></html>
